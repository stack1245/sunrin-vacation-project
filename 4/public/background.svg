<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-labelledby="title description">
  <title id="title">움직이는 방탈출 미로 배경</title>
  <desc id="description">검은 공간에서 입자 미로가 흐르고, 자물쇠 장치가 회전하며, 오른쪽 문이 천천히 열리는 반복 애니메이션</desc>

  <defs>
    <radialGradient id="ambient" cx="70%" cy="42%" r="58%">
      <stop offset="0" stop-color="#487783" stop-opacity=".32"/>
      <stop offset=".28" stop-color="#1a343b" stop-opacity=".18"/>
      <stop offset=".66" stop-color="#081216" stop-opacity=".08"/>
      <stop offset="1" stop-color="#020304" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="doorInterior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f737e" stop-opacity=".68"/>
      <stop offset=".45" stop-color="#11272d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#020405"/>
    </linearGradient>

    <linearGradient id="doorSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304850"/>
      <stop offset=".35" stop-color="#18282d"/>
      <stop offset="1" stop-color="#05090b"/>
    </linearGradient>

    <linearGradient id="floorLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7f1" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#4a9baa" stop-opacity=".1"/>
      <stop offset="1" stop-color="#173f48" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shardSurface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75b4c0" stop-opacity=".03"/>
      <stop offset="1" stop-color="#d1f5f8" stop-opacity=".42"/>
    </linearGradient>

    <pattern id="particlePattern" width="32" height="32" patternUnits="userSpaceOnUse"
             patternTransform="skewX(-8) scale(1 .56)">
      <circle cx="2" cy="2" r="1.7" fill="#b5d5db" fill-opacity=".52"/>
    </pattern>

    <clipPath id="floorClip">
      <path d="M0 435 L1920 435 L1920 1080 L0 1080 Z"/>
    </clipPath>

    <filter id="floorWave" x="-12%" y="-20%" width="124%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .018" numOctaves="1" seed="12" result="noise">
        <animate attributeName="baseFrequency"
                 values=".004 .018;.006 .014;.004 .018"
                 keyTimes="0;.5;1"
                 dur="12s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="44"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .045"/>
      </feComponentTransfer>
    </filter>

    <mask id="floorFade">
      <linearGradient id="floorMaskGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="black"/>
        <stop offset=".1" stop-color="#777"/>
        <stop offset=".35" stop-color="white"/>
        <stop offset=".85" stop-color="#999"/>
        <stop offset="1" stop-color="black"/>
      </linearGradient>
      <rect x="0" y="410" width="1920" height="670" fill="url(#floorMaskGradient)"/>
    </mask>

    <style>
      .door-panel {
        transform-origin: 1328px 428px;
        transform-box: view-box;
        animation: door-open 12s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      .door-light {
        animation: light-breathe 12s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      .lock-outer {
        transform-origin: 1280px 438px;
        transform-box: view-box;
        animation: rotate-clockwise 24s linear infinite;
      }
      .lock-inner {
        transform-origin: 1280px 438px;
        transform-box: view-box;
        animation: rotate-counter 18s linear infinite;
      }
      .shards {
        transform-origin: 1300px 445px;
        transform-box: view-box;
        animation: rotate-clockwise 28s linear infinite;
      }
      .shard {
        animation: shard-breathe 6s ease-in-out infinite;
      }
      .maze-path {
        stroke-dasharray: 10 15;
        animation: maze-flow 9s linear infinite;
      }
      .particles {
        animation: floor-drift 12s ease-in-out infinite;
      }
      .beam {
        stroke-dasharray: 3 18;
        animation: beam-flow 4.5s linear infinite;
      }
      .dust-a { animation: dust-a 12s ease-in-out infinite; }
      .dust-b { animation: dust-b 16s ease-in-out infinite; }
      .pulse { animation: pulse 3.8s ease-in-out infinite; }

      @keyframes door-open {
        0%, 100% { transform: scaleX(1) skewY(0deg); }
        50% { transform: scaleX(.22) skewY(-4deg); }
      }
      @keyframes light-breathe {
        0%, 100% { opacity: .03; }
        50% { opacity: 1; }
      }
      @keyframes rotate-clockwise {
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-counter {
        to { transform: rotate(-360deg); }
      }
      @keyframes shard-breathe {
        0%, 100% { opacity: .25; }
        50% { opacity: .85; }
      }
      @keyframes maze-flow {
        to { stroke-dashoffset: -180; }
      }
      @keyframes floor-drift {
        0%, 100% { transform: translate(0, 0); opacity: .72; }
        50% { transform: translate(-22px, 13px); opacity: 1; }
      }
      @keyframes beam-flow {
        to { stroke-dashoffset: -160; }
      }
      @keyframes dust-a {
        0%, 100% { transform: translate(0, 0); opacity: .2; }
        50% { transform: translate(26px, -18px); opacity: .7; }
      }
      @keyframes dust-b {
        0%, 100% { transform: translate(0, 0); opacity: .18; }
        50% { transform: translate(-20px, 24px); opacity: .55; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .25; }
        50% { opacity: .85; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation-play-state: paused !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#020304"/>
  <rect width="1920" height="1080" fill="url(#ambient)">
    <animate attributeName="opacity" values=".72;1;.72" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Architectural perspective lines -->
  <g fill="none" stroke="#8fc0ca" stroke-width="1" opacity=".1">
    <path d="M460 456 L870 296 L1538 205"/>
    <path d="M460 456 L860 466 L1538 670"/>
    <path d="M735 456 L735 280 L1538 205"/>
    <path d="M735 456 L735 735 L1538 670"/>
    <path d="M920 456 L920 325 L1538 260"/>
    <path d="M920 456 L920 650 L1538 615"/>
  </g>

  <!-- Lock mechanism -->
  <g class="lock-outer" fill="none" stroke="#99d7e1" filter="url(#softGlow)">
    <circle cx="1280" cy="438" r="242" stroke-width="1.2" opacity=".16"
            stroke-dasharray="275 160 95 410"/>
    <circle cx="1280" cy="438" r="214" stroke-width=".8" opacity=".18"
            stroke-dasharray="65 38"/>
    <path d="M1280 176 V196 M1280 680 V700 M1018 438 H1038 M1522 438 H1542"
          stroke-width="1.4" opacity=".28"/>
  </g>
  <g class="lock-inner" fill="none" stroke="#b8e7ed" filter="url(#softGlow)">
    <circle cx="1280" cy="438" r="170" stroke-width="1" opacity=".14"
            stroke-dasharray="180 90 70 240"/>
    <circle cx="1280" cy="438" r="145" stroke-width=".7" opacity=".18"
            stroke-dasharray="7 22"/>
  </g>

  <!-- Animated particle floor -->
  <g clip-path="url(#floorClip)" mask="url(#floorFade)">
    <g class="particles" filter="url(#floorWave)">
      <path d="M-160 480 Q420 390 970 510 T2110 475 L2110 1120 L-160 1120 Z"
            fill="url(#particlePattern)" opacity=".9"/>
    </g>

    <!-- Perspective maze paths -->
    <g class="maze-path" fill="none" stroke="#9ed8e2" stroke-width="1.5"
       stroke-linecap="round" opacity=".32" filter="url(#softGlow)">
      <path d="M120 864 L495 704 L710 704 L852 628"/>
      <path d="M350 1025 L650 835 L650 747 L940 607"/>
      <path d="M770 1080 L770 873 L995 750 L995 624"/>
      <path d="M1040 1080 L1040 892 L1220 780 L1220 662"/>
      <path d="M1290 1080 L1290 915 L1510 782 L1510 624"/>
      <path d="M1510 1045 L1510 902 L1710 806 L1860 806"/>
      <path d="M65 730 L390 640 L620 640 L780 565"/>
      <path d="M1560 706 L1735 650 L1910 650"/>
    </g>
  </g>

  <!-- Light spilling from the opening door -->
  <g class="door-light">
    <path d="M1062 670 L1328 670 L1770 1080 L520 1080 Z"
          fill="url(#floorLight)" opacity=".82"/>
    <ellipse cx="1200" cy="682" rx="190" ry="42"
             fill="#84d3df" opacity=".13" filter="url(#wideGlow)"/>
  </g>

  <!-- Door interior and nested frames -->
  <path d="M1062 190 L1328 190 L1328 670 L1062 670 Z"
        fill="url(#doorInterior)" stroke="#b5e3e9" stroke-width="1.4"
        filter="url(#softGlow)"/>
  <g class="door-light" fill="none" stroke="#a9dce5" opacity=".35">
    <path d="M1080 212 H1310 V651 H1080 Z"/>
    <path d="M1100 236 H1290 V630 H1100 Z" opacity=".65"/>
    <path d="M1120 260 H1270 V609 H1120 Z" opacity=".4"/>
  </g>

  <!-- Opening door panel -->
  <g class="door-panel">
    <path d="M1062 190 L1328 190 L1328 670 L1062 670 Z"
          fill="url(#doorSurface)" stroke="#c7edf1" stroke-width="1.5"
          filter="url(#softGlow)"/>
    <path d="M1077 207 L1311 207 L1311 651 L1077 651 Z"
          fill="none" stroke="#91bbc3" stroke-width=".7" opacity=".25"/>
    <g class="pulse" fill="#d5f5f7" filter="url(#softGlow)">
      <circle cx="1198" cy="413" r="6"/>
      <path d="M1194 418 L1192 442 H1204 L1202 418 Z"/>
    </g>
    <path d="M1082 214 L1308 214" stroke="#e1f7f9" opacity=".24"/>
  </g>

  <!-- Door frame and moving beam -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M1062 670 L1062 190 L1328 190 L1328 670"
          stroke="#d6f3f6" stroke-width="2" opacity=".78"/>
    <path class="beam" d="M1328 190 L770 315"
          stroke="#bde7ec" stroke-width="1.2" opacity=".52"/>
  </g>

  <!-- Orbiting puzzle shards -->
  <g class="shards" fill="url(#shardSurface)" stroke="#b5e1e7" stroke-width=".7"
     filter="url(#softGlow)">
    <rect class="shard" x="1475" y="235" width="14" height="58" transform="rotate(68 1482 264)"/>
    <rect class="shard" x="1610" y="364" width="11" height="82" transform="rotate(15 1615 405)"
          style="animation-delay:-1.2s"/>
    <rect class="shard" x="1530" y="560" width="16" height="66" transform="rotate(-42 1538 593)"
          style="animation-delay:-2.7s"/>
    <rect class="shard" x="1390" y="684" width="12" height="72" transform="rotate(34 1396 720)"
          style="animation-delay:-.7s"/>
    <rect class="shard" x="1040" y="625" width="15" height="61" transform="rotate(-28 1047 655)"
          style="animation-delay:-3.5s"/>
    <rect class="shard" x="970" y="410" width="10" height="56" transform="rotate(54 975 438)"
          style="animation-delay:-1.8s"/>
    <rect class="shard" x="1090" y="260" width="17" height="73" transform="rotate(-70 1098 296)"
          style="animation-delay:-4.1s"/>
    <rect class="shard" x="1378" y="308" width="9" height="48" transform="rotate(78 1382 332)"
          style="animation-delay:-2.1s"/>
  </g>

  <!-- Floating dust -->
  <g class="dust-a" fill="#c9edf1" opacity=".38">
    <circle cx="1004" cy="328" r="2"/>
    <circle cx="1118" cy="370" r="3"/>
    <circle cx="1256" cy="270" r="1.6"/>
    <circle cx="1420" cy="312" r="2.2"/>
    <circle cx="1515" cy="485" r="2.8"/>
    <circle cx="1320" cy="538" r="1.7"/>
  </g>
  <g class="dust-b" fill="#a9d8df" opacity=".3">
    <circle cx="905" cy="405" r="1.4"/>
    <circle cx="1175" cy="505" r="2.3"/>
    <circle cx="1462" cy="230" r="1.5"/>
    <circle cx="1590" cy="530" r="2"/>
    <circle cx="1035" cy="578" r="2.5"/>
  </g>

  <!-- Left-side readability shade and vignette -->
  <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".66"/>
    <stop offset=".52" stop-color="#000" stop-opacity=".16"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <rect width="1150" height="1080" fill="url(#leftShade)"/>

  <radialGradient id="vignette" cx="55%" cy="51%" r="74%">
    <stop offset=".52" stop-color="#000" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000" stop-opacity=".32"/>
    <stop offset="1" stop-color="#000" stop-opacity=".72"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <rect width="1920" height="1080" filter="url(#grain)" opacity=".42"
        pointer-events="none"/>
</svg>
